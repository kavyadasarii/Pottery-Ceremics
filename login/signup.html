<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ClayCraft – Sign Up</title>
  <link rel="stylesheet" href="auth.css" />
  <link rel="icon" type="image/svg+xml" href="../components/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="auth-layout">

    
    <div class="highlights-panel">
      <div class="highlights-inner">
        
        <h1 class="panel-heading">Begin Your<br/><em>Clay Journey</em></h1>
        <p class="panel-sub">Join thousands of pottery lovers. From beginner wheel-throwing sessions to advanced ceramics — every piece tells a story shaped by your hands.</p>
        <div class="pottery-image">
    <img src="signup.jpg" alt="Pottery Studio">
</div>
      </div>
    </div>

    
    <div class="card-panel">
      <div class="auth-card">

        
        <div class="card-brand">
          <a href="../home-1/home.html" class="brand-link">
            <svg class="brand-icon-svg" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="authLogoGradSignup" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#b07a4f"/>
                  <stop offset="100%" stop-color="#e8a96a"/>
                </linearGradient>
              </defs>
              <path d="M24 14h16l-1.5 6.5c3 2.2 5 6 5 10.5 0 8-6 14.5-11.5 18.5-5.5-4-11.5-10.5-11.5-18.5 0-4.5 2-8.3 5-10.5L24 14z"
                    fill="none" stroke="url(#authLogoGradSignup)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
              <line x1="23" y1="20" x2="41" y2="20" stroke="url(#authLogoGradSignup)" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <span class="brand-text">Clay<span>Craft</span></span>
          </a>
          <button type="button" class="auth-theme-btn" id="authThemeToggle" aria-label="Toggle theme">🌙</button>
        </div>

        <h2 class="card-title">Create Account</h2>
        <p class="card-subtitle">Start shaping your pottery story today</p>

        <form class="auth-form" onsubmit="return false">
          <div class="fields-row">
            <div class="field-group">
              <label for="fname">First Name</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                <input type="text" id="fname" placeholder="Emma" autocomplete="given-name"/>
              </div>
            </div>
            <div class="field-group">
              <label for="lname">Last Name</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                <input type="text" id="lname" placeholder="Clarke" autocomplete="family-name"/>
              </div>
            </div>
          </div>

          <div class="field-group">
            <label for="email">Email Address</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5h15v10h-15z" stroke="currentColor" stroke-width="1.4" rx="1"/><path d="M2.5 5.5l7.5 5.5 7.5-5.5" stroke="currentColor" stroke-width="1.4"/></svg>
              <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
            </div>
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V6.5a3 3 0 016 0V9" stroke="currentColor" stroke-width="1.4"/></svg>
              <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password"/>
              <button type="button" class="eye-btn" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
                <svg class="eye-icon eye-closed" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
                <svg class="eye-icon eye-open hidden" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="currentColor" stroke-width="1.4"/><line x1="3" y1="3" x2="17" y2="17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>

          <div class="field-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V6.5a3 3 0 016 0V9" stroke="currentColor" stroke-width="1.4"/></svg>
              <input type="password" id="confirm-password" placeholder="Repeat your password" autocomplete="new-password"/>
              <button type="button" class="eye-btn" onclick="togglePassword('confirm-password', this)" aria-label="Toggle confirm password visibility">
                <svg class="eye-icon eye-closed" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
                <svg class="eye-icon eye-open hidden" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="currentColor" stroke-width="1.4"/><line x1="3" y1="3" x2="17" y2="17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Create Account →</button>

          <div class="divider"><span>or</span></div>

          <div class="oauth-buttons">
            <button type="button" class="btn-google">
              <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
              Continue with Google
            </button>

            <button type="button" class="btn-apple">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.616 2.13-1.383 2.79-.79.67-1.87 1.32-2.94 1.24-.14-1.09.44-2.24 1.17-2.95.79-.77 2.06-1.32 3.15-1.08zM20.13 17.03c-.55 1.22-.82 1.76-1.53 2.83-.99 1.48-2.38 3.33-4.12 3.34-1.55.02-1.95-1.02-4.06-1.01-2.1.01-2.55 1.03-4.1 1-1.75-.02-3.08-1.68-4.07-3.15C-.6 15.98-.02 8.99 3.66 5.44c1.44-1.39 3.35-2.14 5.15-2.03 1.36.08 2.42.86 3.24.86.81 0 2.05-.9 3.6-.85.62.03 3.35.25 5.05 2.98-.13.09-3.02 1.77-2.99 5.28.03 4.19 3.7 5.6 3.82 5.65-.06.16-.42 1.4-1.4 2.7z"/></svg>
              Continue with Apple
            </button>
          </div>

          <p class="switch-auth">Already have an account? <a href="login.html">Sign in</a></p>
        </form>

      </div>
    </div>

  </div>

  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const closed = btn.querySelector('.eye-closed');
      const open = btn.querySelector('.eye-open');
      if (input.type === 'password') {
        input.type = 'text';
        closed.classList.add('hidden');
        open.classList.remove('hidden');
      } else {
        input.type = 'password';
        closed.classList.remove('hidden');
        open.classList.add('hidden');
      }
    }

    // Keep this page's theme in sync with the rest of the site.
    // NOTE: assumes localStorage key "theme" with values "dark" / "light" —
    // update this to match global.js if your site uses a different key.
    (function () {
      var body = document.body;
      var toggleBtn = document.getElementById('authThemeToggle');

      function applyTheme(theme) {
        if (theme === 'dark') {
          body.classList.add('dark-mode');
          if (toggleBtn) toggleBtn.textContent = '☀️';
        } else {
          body.classList.remove('dark-mode');
          if (toggleBtn) toggleBtn.textContent = '🌙';
        }
      }

      var saved = localStorage.getItem('theme');
      applyTheme(saved === 'dark' ? 'dark' : 'light');

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          var next = body.classList.contains('dark-mode') ? 'light' : 'dark';
          applyTheme(next);
          localStorage.setItem('theme', next);
        });
      }
    })();
  </script>
</body>
</html>
