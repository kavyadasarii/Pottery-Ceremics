<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · TerraKiln Pottery Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="auth.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
</head>
<body>

<div class="utility-bar">
  <button type="button" class="utility-btn rtl-toggle" aria-label="Toggle RTL">
    <i class="fa-solid fa-right-left"></i>
  </button>
  <button type="button" class="utility-btn theme-toggle" aria-label="Toggle theme">
    <i class="fa-solid fa-sun icon-sun"></i>
    <i class="fa-solid fa-moon icon-moon"></i>
  </button>
</div>

<div class="auth-shell">
  <div class="auth-card">

    <a href="../home-1/home.html" class="auth-logo">
      <span class="mark">
        <svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M22 12h20l-2 8c4 3 6.5 8 6.5 14 0 11-8 18.5-14.5 22-6.5-3.5-14.5-11-14.5-22 0-6 2.5-11 6.5-14l-2-8z"
                fill="#fff"/>
          <rect x="21" y="12" width="22" height="4.5" rx="2.2" fill="#fff"/>
        </svg>
      </span>
      <span class="logo-text">
        <span class="name">Terra<span>Kiln</span></span>
        <span class="sub">Pottery Studio</span>
      </span>
    </a>

    <h1>Welcome Back</h1>

    <form data-auth-form="login">

      <div class="field">
        <label for="login-email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <div class="input-wrap">
          <input type="password" id="login-password" name="password" class="has-toggle" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="toggle-visibility" data-target="login-password" aria-label="Show password">
            <i class="fa-solid fa-eye-slash"></i>
          </button>
        </div>
      </div>

      <div class="field-meta">
        <label class="checkbox-row">
          <input type="checkbox" name="remember">
          <span>Remember me</span>
        </label>
        <a>Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">
        Log In <i class="fa-solid fa-arrow-right"></i>
      </button>

    </form>

    <p class="divider">or continue with</p>

    <div class="social-row">
      <button type="button" class="social-btn google"><i class="fa-brands fa-google"></i> Google</button>
      <button type="button" class="social-btn apple"><i class="fa-brands fa-apple"></i> Apple</button>
    </div>

    <p class="auth-footer-note">Don't have an account? <a href="signup.html">Sign up</a></p>

  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
