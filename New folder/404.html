<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — ClayCraft</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --clay-terracotta: #c1714a;
    --clay-rust: #8b3a1e;
    --clay-smoke: #f5ede0;
    --clay-mid: #6b4c33;
    --clay-warm: #d4956a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--clay-smoke);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(193,113,74,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(139,58,30,0.08) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  
  .logo {
    position: fixed;
    top: 1rem; left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem; font-weight: 700;
    text-decoration: none; letter-spacing: 0.01em;
    z-index: 10; white-space: nowrap;
  }
  .logo .clay  { color: #a05a2c; }
  .logo .craft { color: #c1714a; }

  .orb { position: fixed; border-radius: 50%; opacity: 0.14; pointer-events: none; }
  .orb-1 { width: 240px; height: 240px; background: var(--clay-terracotta); top: -60px; right: -60px; animation: drift 10s ease-in-out infinite; }
  .orb-2 { width: 150px; height: 150px; background: var(--clay-warm); bottom: 10px; left: -45px; animation: drift 13s 2s ease-in-out infinite reverse; }
  @keyframes drift { 0%,100% { transform:translate(0,0); } 50% { transform:translate(14px,-14px); } }

  .container {
    position: relative; z-index: 1;
    text-align: center;
    padding: 4.5rem 1.5rem 1.5rem;
    max-width: 540px; width: 100%;
    display: flex; flex-direction: column; align-items: center;
  }

  .clay-blob {
    width: 100px; height: 100px;
    margin-bottom: 0.5rem;
    animation: wobble 6s ease-in-out infinite;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(-2deg) scale(1); }
    33%      { transform: rotate(2deg) scale(1.04); }
    66%      { transform: rotate(-1deg) scale(0.97); }
  }

  .four-o-four {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 13vw, 6.5rem);
    font-weight: 700; line-height: 1;
    color: var(--clay-terracotta);
    letter-spacing: -3px;
    text-shadow: 4px 4px 0 var(--clay-rust), 7px 7px 0 rgba(139,58,30,0.12);
    animation: fadeDown 0.8s cubic-bezier(0.22,1,0.36,1) both;
    margin-bottom: 0.15rem;
  }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-18px);} to{opacity:1;transform:translateY(0);} }

  .crack-line {
    display: block; width: 40px; height: 2px;
    background: var(--clay-terracotta); border-radius: 2px;
    opacity: 0.4; margin: 0.5rem auto;
    animation: fadeUp 0.9s 0.2s both;
  }

  .headline {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(0.95rem, 2.8vw, 1.25rem);
    color: var(--clay-mid); margin-bottom: 0.5rem;
    animation: fadeUp 0.9s 0.15s cubic-bezier(0.22,1,0.36,1) both;
  }

  .body-text {
    font-size: 0.855rem; font-weight: 300;
    color: var(--clay-mid); line-height: 1.65;
    max-width: 360px; margin: 0 auto 1.3rem;
    animation: fadeUp 0.9s 0.25s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }

  .btn {
    display: inline-block;
    background: var(--clay-terracotta); color: #fff;
    text-decoration: none;
    font-family: 'DM Sans', sans-serif; font-weight: 500;
    font-size: 0.86rem; letter-spacing: 0.04em;
    padding: 0.68rem 1.9rem; border-radius: 50px;
    border: none; cursor: pointer;
    transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
    box-shadow: 0 4px 14px rgba(193,113,74,0.28);
    animation: fadeUp 0.9s 0.35s cubic-bezier(0.22,1,0.36,1) both;
  }
  .btn:hover { background: var(--clay-rust); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(193,113,74,0.36); }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<a class="logo" href="/"><span class="clay">Clay</span><span class="craft">Craft</span></a>

<div class="container">

  <svg class="clay-blob" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="110" cy="150" rx="72" ry="55" fill="#c1714a" opacity="0.9"/>
    <ellipse cx="110" cy="100" rx="48" ry="14" fill="#d4956a"/>
    <rect x="62" y="100" width="96" height="52" rx="4" fill="#c1714a"/>
    <polyline points="115,105 108,130 118,155 105,175" stroke="#8b3a1e" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <ellipse cx="110" cy="192" rx="70" ry="12" fill="#8b3a1e" opacity="0.12"/>
    <ellipse cx="88" cy="118" rx="14" ry="6" fill="white" opacity="0.12" transform="rotate(-20 88 118)"/>
    <polygon points="65,98 75,88 80,102 68,106" fill="#f5ede0" opacity="0.9"/>
    <polygon points="155,108 165,100 162,116 152,118" fill="#f5ede0" opacity="0.85"/>
    <text x="99" y="148" font-family="Georgia,serif" font-size="38" font-style="italic" fill="white" opacity="0.28" font-weight="bold">?</text>
  </svg>

  <div class="four-o-four">404</div>
  <span class="crack-line"></span>
  <p class="headline">This page crumbled to dust.</p>
  <p class="body-text">Looks like the page you were looking for has been moulded into something else — or maybe it never existed. Let's get you back to the studio.</p>
  <a href="../home-1/home.html" class="btn">← Back to the Studio</a>

</div>
</body>
</html>
